apiVersion: 1
providers:
  - name: Capibara
    orgId: 1
    type: file
    # Keep the old provider name to detach existing dashboards without deleting
    # their panels/history. This directory contains YAML only, no dashboard JSON.
    # scripts/provision_grafana.py imports the initial dashboard once via the API.
    disableDeletion: true
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards
