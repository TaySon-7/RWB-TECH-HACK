name: rwb-analytics
services:
  kafka:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    restart: unless-stopped
    mem_limit: 1400m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 134217728
      KAFKA_LOG_SEGMENT_BYTES: 33554432
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
      CLUSTER_ID: RWBcapibara2026techhack
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
  clickhouse:
    build: {context: ., dockerfile: clickhouse/Dockerfile}
    restart: unless-stopped
    mem_limit: 3g
    environment:
      CLICKHOUSE_USER: pipeline
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run python3 scripts/init_analytics_env.py}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/server.xml:/etc/clickhouse-server/config.d/capibara.xml:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
  pipeline:
    build: {context: ., dockerfile: pipeline/Dockerfile}
    profiles: [tools]
    mem_limit: 700m
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: pipeline
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Run python3 scripts/init_analytics_env.py}
      CLICKHOUSE_AGENT_PASSWORD: ${CLICKHOUSE_AGENT_PASSWORD:?Run python3 scripts/init_analytics_env.py}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      kafka: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
  grafana:
    image: grafana/grafana@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    restart: unless-stopped
    mem_limit: 700m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run python3 scripts/init_analytics_env.py}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.2
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: UTC
      GF_USERS_DEFAULT_THEME: dark
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      clickhouse: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://localhost:3000/api/health]
      interval: 10s
      timeout: 5s
      retries: 30
  agent:
    build: {context: ., dockerfile: sql_agent/Dockerfile}
    restart: unless-stopped
    mem_limit: 700m
    env_file:
      - path: .env.agent
        required: false
    environment:
      AGENT_DB_BACKEND: clickhouse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_AGENT_PASSWORD: ${CLICKHOUSE_AGENT_PASSWORD}
      AGENT_REQUIRE_GRAFANA_AUTH: "true"
      GRAFANA_URL: http://grafana:3000
      AGENT_RUNTIME_DIR: /app/runtime
    volumes:
      - agent_data:/app/runtime
    depends_on:
      clickhouse: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    mem_limit: 100m
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      grafana: {condition: service_healthy}
      agent: {condition: service_healthy}
volumes:
  kafka_data:
  clickhouse_data:
  grafana_data:
  agent_data:
